name = "fluxa-data-client"
main = "src/index.ts"
compatibility_date = "2026-07-30"
compatibility_flags = ["nodejs_compat"]

# D1 (fluxa-db) is no longer used - Postgres/Neon replaced it. The database
# itself was left alone in Cloudflare (not deleted); remove it manually via
# `wrangler d1 delete fluxa-db` if you're sure you don't need it.

# Same Worker, second hostname: the website (fluxa.agency) calls the API from the browser with a session cookie,
# which only works first-party-style when both share the registrable domain. The Designer Extension keeps using the
# workers.dev hostname (its cookies are partitioned per host, so the two never collide).
routes = [{ pattern = "api.fluxa.agency", custom_domain = true }]
# Adding `routes` makes wrangler DISABLE the workers.dev hostname unless this is explicit - and the Designer Extension,
# the Webflow OAuth redirect and Google sign-in all still use it. Keep it on.
workers_dev = true

[vars]
# Where the website lives - /billing/start sends logged-out visitors to its /login page.
WEB_APP_URL = "https://fluxa.agency"
WEBFLOW_CLIENT_ID = "69de87bde618fafc0c3c4571eaf4f8c917b54bd9d4c140dcf806b8a0fa79211e"
WEBFLOW_REDIRECT_URI = "https://fluxa-data-client.jojanmartinez533.workers.dev/auth/callback"
BETTER_AUTH_URL = "https://fluxa-data-client.jojanmartinez533.workers.dev"
DESIGNER_EXTENSION_ORIGIN = "https://6a6bb6b4db84ef2c530166e7.webflow-ext.com"
# Not secret (just an account identifier) - used by lib/emailRoutingGuard.ts,
# a TEMPORARY workaround for the Email Sending sandbox, see that file's
# top-of-file comment. Remove alongside it once on Workers Paid.
CLOUDFLARE_ACCOUNT_ID = "2137e37d161abba0e634109cfde544f1"
# Lemon Squeezy (routes/billing.ts) - identify the already-created "Pro"
# product/variant in the dashboard, not sensitive on their own (an API key is
# still required to act on them - see the secrets list below). PLACEHOLDER
# VALUES - fill in with the real Store ID / Variant ID from the Lemon
# Squeezy dashboard (Test mode first) before billing/checkout will work.
LEMONSQUEEZY_STORE_ID = "484741"
LEMONSQUEEZY_VARIANT_MONTHLY = "2218936"
LEMONSQUEEZY_VARIANT_YEARLY = "2218946"

# Secrets, do NOT put real values here - set them with:
#   wrangler secret put WEBFLOW_CLIENT_SECRET
#   wrangler secret put DATABASE_URL           (Neon connection string)
#   wrangler secret put BETTER_AUTH_SECRET     (random 32+ byte string)
#   wrangler secret put GOOGLE_CLIENT_ID
#   wrangler secret put GOOGLE_CLIENT_SECRET
#   wrangler secret put CLOUDFLARE_API_TOKEN   (scoped to Account > Email
#                                                Routing Addresses > Edit only
#                                                - see emailRoutingGuard.ts)
#   wrangler secret put CLOUDFLARE_ANALYTICS_API_TOKEN
#                                               (Cloudflare Account API token,
#                                                scoped to "Account Analytics
#                                                Read" only - routes/
#                                                adminAnalytics.ts)
#   wrangler secret put LEMONSQUEEZY_API_KEY   (Lemon Squeezy dashboard ->
#                                                Settings -> API, Test mode
#                                                first - routes/billing.ts)
#   wrangler secret put LEMONSQUEEZY_WEBHOOK_SECRET
#                                               (the signing secret shown when
#                                                creating the webhook in Lemon
#                                                Squeezy's dashboard, pointed
#                                                at POST /api/billing/webhook)

# R2 bucket for user-uploaded avatars (routes/profile.ts). Requires R2 to be
# enabled on this Cloudflare account first (Dashboard > R2 - a one-time
# account-level activation, confirmed by `wrangler r2 bucket create
# fluxa-avatars` failing with "Please enable R2 through the Cloudflare
# Dashboard" [code: 10042] under this account's current wrangler OAuth grant)
# and the bucket itself created (`wrangler r2 bucket create fluxa-avatars`)
# before this binding will resolve - `wrangler dev`/`deploy` fail otherwise.
[[r2_buckets]]
binding = "AVATARS"
bucket_name = "fluxa-avatars"

# R2 bucket for admin-captured preset gallery thumbnails
# (routes/galleryPresets.ts, apps/preset-admin) - a separate bucket from
# AVATARS above since it's a different content category (admin-created
# gallery assets, not user-personal photos), created the same way
# (`wrangler r2 bucket create fluxa-preset-thumbnails`).
[[r2_buckets]]
binding = "PRESET_THUMBNAILS"
bucket_name = "fluxa-preset-thumbnails"

# R2 bucket for self-hosted, versioned runtime bundles served to published
# Webflow sites (routes/runtimeAssets.ts) - e.g. glass-liquid-runtime.v1.js
# (apps/glass-liquid-runtime). A separate bucket from AVATARS/PRESET_THUMBNAILS
# above since it's yet another content category (compiled JS assets every
# customer's published site loads, not admin/user-uploaded images), same
# creation step (`wrangler r2 bucket create fluxa-runtime-assets`).
[[r2_buckets]]
binding = "RUNTIME_ASSETS"
bucket_name = "fluxa-runtime-assets"

# Workers Analytics Engine dataset for custom product events
# (routes/analytics.ts) - Designer Extension usage events and published-site
# embed impressions, NOT the built-in per-request HTTP analytics Cloudflare
# already collects for this Worker's own zone automatically. Free-plan-
# compatible (100k writes/day, 10k reads/day on Workers Free - confirmed
# against current Cloudflare docs before relying on it, since this account
# is deliberately staying on Workers Free for now, see CLAUDE.md's Email
# Service section). The dataset is created automatically on the first
# writeDataPoint() call - unlike the R2 buckets below, there is no separate
# `wrangler ... create` provisioning step.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "fluxa_events"

# Cloudflare Email Service binding - used by lib/auth.ts's emailOTP plugin to
# send the password-reset code. fluxa.agency must be onboarded first via
# `wrangler email sending enable fluxa.agency` (requires the domain's
# nameservers to be pointed at Cloudflare and the zone active), otherwise
# sends fail with E_SENDER_NOT_VERIFIED. For local `wrangler dev` testing,
# temporarily add `remote = true` here to actually deliver emails instead of
# just simulating the send - remove it again before deploying.
[[send_email]]
name = "EMAIL"
